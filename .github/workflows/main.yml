name: huluxia_signin
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 初始化python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r ./requirements.txt

      - name: 开始运行
        id: signin-outputs
        env:
          NOTIFIER_TYPE: ${{ secrets.NOTIFIER_TYPE }}
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
        run: |
          python ./main.py
